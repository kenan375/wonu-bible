<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>원어서재</title>
<meta name="theme-color" content="#16191d">
<meta name="description" content="개역개정과 히브리어·헬라어 원문, 관주, 영어 성경을 절마다 펼쳐 보는 개인용 원어 성경">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>try{var t=localStorage.getItem("wb.theme");if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <button class="brand" id="loc" type="button" aria-haspopup="dialog"><span class="logo">א</span><span id="locText">원어서재</span></button>
  <span class="padname" id="padName">Basic Pad</span>
  <span class="grow"></span>
  <button class="iconbtn" id="btnTop" type="button" aria-label="검색 패널로">⌕</button>
  <button class="iconbtn" id="btnNotes" type="button" aria-label="노트">✎</button>
  <button class="iconbtn" id="btnTheme" type="button" aria-label="밝기 전환">☀</button>
  <button class="iconbtn" id="btnSettings" type="button" aria-label="메뉴">☰</button>
</header>

<section class="ctrl" id="ctrl" aria-label="검색과 구간 선택">
  <form class="qrow" id="quickForm">
    <input type="search" id="quick" autocomplete="off" enterkeyhint="search" placeholder="창 15:1 · 창 15~아브람 · 사랑, 믿음">
    <button class="qbtn" type="button" id="quickHelp" aria-label="빠른 검색 도움말">[?]</button>
    <button class="qbtn go" type="submit">검색</button>
  </form>
  <form class="qrow" id="ctxForm">
    <input type="search" id="ctxq" autocomplete="off" enterkeyhint="search" placeholder="문장으로: 남편을 사랑한다 · 요즘 힘들다">
    <button class="qbtn" type="button" id="ctxHelp" aria-label="맥락 검색 도움말">[?]</button>
    <button class="qbtn go ctx" type="submit">맥락 검색</button>
  </form>

  <div class="range">
    <span class="rlabel">시작</span>
    <select id="b1" aria-label="시작 책"></select><select id="c1" aria-label="시작 장"></select><select id="v1" aria-label="시작 절"></select>
    <span class="rlabel">끝</span>
    <select id="b2" aria-label="끝 책"></select><select id="c2" aria-label="끝 장"></select><select id="v2" aria-label="끝 절"></select>
    <span class="rlabel"></span>
    <input type="search" id="kw" placeholder="검색어 입력…" autocomplete="off" aria-label="구간 안 검색어">
    <button class="qbtn go" type="button" id="rangeGo">선택</button>
    <select id="andor" aria-label="검색어 조건"><option value="or">or</option><option value="and">and</option></select>
  </div>

  <div class="tools-row">
    <button class="tbtn" type="button" id="resetBtn" aria-label="처음 상태로">↻</button>
    <button class="tbtn" type="button" id="fsDown">A-</button>
    <button class="tbtn" type="button" id="fsUp">A+</button>
    <button class="tbtn tog" type="button" id="allOrig" aria-pressed="false">원어 펼침</button>
    <button class="tbtn tog" type="button" id="glossBtn" aria-pressed="false">단어 뜻</button>
    <button class="tbtn tog" type="button" id="allEn" aria-pressed="false">EN</button>
  </div>
  <div class="ttsbar" id="ttsBar" hidden>
    <button class="tbtn" type="button" id="ttsPlay">▶ 재생</button>
    <button class="tbtn" type="button" id="ttsPause">⏸ 멈춤</button>
    <button class="tbtn" type="button" id="ttsStop">■ 정지</button>
    <select id="ttsRate2" aria-label="읽기 속도"><option value="0.8">0.8배</option><option value="1">1배</option><option value="1.2">1.2배</option><option value="1.5">1.5배</option></select>
  </div>
  <p class="info" id="info" aria-live="polite"></p>
</section>

<main id="reader"></main>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-head">
    <h2 id="sheetTitle"></h2>
    <button class="iconbtn" id="sheetClose" type="button" aria-label="닫기">✕</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<div class="toast" id="toast" role="status" hidden></div>

<script src="vendor/sql-wasm.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
